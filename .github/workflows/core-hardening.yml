name: One-shot core integrity hardening

on:
  push:
    branches:
      - codex/audit-ux-hardening
    paths:
      - .github/workflows/core-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/audit-ux-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Patch signature dispatch and output identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pipeline_path = Path("src/butterfly_saxs/pipeline.py")
          text = pipeline_path.read_text(encoding="utf-8")

          old_adapter = '''def _call_adapter(fn: Any, *, image: np.ndarray, qmap: Any = None, config: Any = None, **extra: Any) -> Any:
              """Call an optional adapter across the small API variants used in this repo."""

              values = {
                  "image": image,
                  "data": image,
                  "frame": image,
                  "intensity": image,
                  "qmap": qmap,
                  "q_map": qmap,
                  "config": config,
                  **extra,
              }
              try:
                  signature = _inspect.signature(fn)
              except (TypeError, ValueError):
                  signature = None
              if signature is not None:
                  accepts_kwargs = any(
                      parameter.kind == _inspect.Parameter.VAR_KEYWORD
                      for parameter in signature.parameters.values()
                  )
                  kwargs = {
                      name: value
                      for name, value in values.items()
                      if value is not None
                      and (accepts_kwargs or name in signature.parameters)
                  }
                  try:
                      return fn(**kwargs)
                  except TypeError:
                      # A positional-only function is common in small scientific helper
                      # modules.  Fall through to the conservative forms below.
                      pass
              attempts = [
                  ((image, qmap), {}),
                  ((image,), {"qmap": qmap}),
                  ((image,), {}),
              ]
              last_error: TypeError | None = None
              for args, kwargs in attempts:
                  if qmap is None and args == (image, qmap):
                      continue
                  try:
                      return fn(*args, **kwargs)
                  except TypeError as exc:
                      last_error = exc
              if last_error is not None:
                  raise last_error
              return fn(image)
          '''

          new_adapter = '''def _call_adapter(fn: Any, *, image: np.ndarray, qmap: Any = None, config: Any = None, **extra: Any) -> Any:
              """Call one compatible adapter form without swallowing its own errors."""

              values = {
                  "image": image,
                  "data": image,
                  "frame": image,
                  "intensity": image,
                  "qmap": qmap,
                  "q_map": qmap,
                  "config": config,
                  **extra,
              }
              try:
                  signature = _inspect.signature(fn)
              except (TypeError, ValueError):
                  signature = None

              attempts: list[tuple[tuple[Any, ...], dict[str, Any]]] = []
              if signature is not None:
                  accepts_kwargs = any(
                      parameter.kind == _inspect.Parameter.VAR_KEYWORD
                      for parameter in signature.parameters.values()
                  )
                  named_kwargs = {
                      name: value
                      for name, value in values.items()
                      if value is not None
                      and (accepts_kwargs or name in signature.parameters)
                  }
                  attempts.append(((), named_kwargs))
              attempts.extend(
                  [
                      ((image, qmap), {}),
                      ((image,), {"qmap": qmap}),
                      ((image,), {}),
                  ]
              )

              if signature is not None:
                  last_bind_error: TypeError | None = None
                  for args, kwargs in attempts:
                      if qmap is None and args == (image, qmap):
                          continue
                      try:
                          signature.bind(*args, **kwargs)
                      except TypeError as exc:
                          last_bind_error = exc
                          continue
                      # Binding succeeded, so a TypeError raised now originates
                      # inside the adapter and must propagate without a retry.
                      return fn(*args, **kwargs)
                  if last_bind_error is not None:
                      raise last_bind_error

              # Some extension/builtin callables do not expose a signature.
              # Preserve the compatibility fallback only for that narrow case.
              last_error: TypeError | None = None
              for args, kwargs in attempts[1:]:
                  if qmap is None and args == (image, qmap):
                      continue
                  try:
                      return fn(*args, **kwargs)
                  except TypeError as exc:
                      last_error = exc
              if last_error is not None:
                  raise last_error
              return fn(image)
          '''

          old_stem = '''def _safe_stem(source: Any, fallback: str = "frame") -> str:
              if isinstance(source, (str, os.PathLike)):
                  stem = Path(source).stem
              else:
                  stem = fallback
              stem = re.sub(r"[^A-Za-z0-9_.-]+", "_", stem).strip("._")
              return stem or fallback
          '''

          new_stem = '''def _safe_stem(source: Any, fallback: str = "frame") -> str:
              if isinstance(source, (str, os.PathLike)):
                  stem = Path(source).stem
              else:
                  stem = fallback
              stem = re.sub(r"[^A-Za-z0-9_.-]+", "_", stem).strip("._")
              return stem or fallback


          def _safe_token(value: Any, fallback: str) -> str:
              token = re.sub(r"[^A-Za-z0-9_.-]+", "_", str(value)).strip("._")
              return token or fallback


          def _result_stem(metadata: Mapping[str, Any]) -> str:
              """Build a collision-resistant default stem from source identity."""

              parts = [_safe_stem(metadata.get("path"), "frame")]
              dataset = metadata.get("dataset")
              if dataset not in (None, ""):
                  parts.append(f"dataset-{_safe_token(dataset, 'dataset')}")
              frame = metadata.get("frame")
              if frame is not None:
                  try:
                      frame_token = f"{int(frame):06d}"
                  except (TypeError, ValueError):
                      frame_token = _safe_token(frame, "unknown")
                  parts.append(f"frame-{frame_token}")
              return "__".join(parts)
          '''

          old_export = '''    A directory target creates ``<stem>.json`` and ``<stem>.npz``.  A target
              ending in ``.json``, ``.npz``, or ``.csv`` writes just that representation.
          '''
          new_export = '''    A directory target creates ``<identity>.json`` and ``<identity>.npz``.
              Container dataset/frame selectors are included in that identity to prevent
              multi-frame exports from overwriting or blocking one another.  A target ending
              in ``.json``, ``.npz``, or ``.csv`` writes just that representation.
          '''
          old_export_stem = '''    else:
                  stem = _safe_stem(result.metadata.get("path"), "frame")
                  paths = [target / f"{stem}.json", target / f"{stem}.npz"]
          '''
          new_export_stem = '''    else:
                  stem = _result_stem(result.metadata)
                  paths = [target / f"{stem}.json", target / f"{stem}.npz"]
          '''

          old_gui = '''def launch_gui(*args: Any, **kwargs: Any) -> Any:
              """Delegate to an optional GUI while keeping the CLI seam stable."""

              launcher = _find_callable(
                  ("butterfly_saxs.gui", "butterfly_saxs.gui.app", "butterfly_saxs.ui"),
                  ("launch", "run", "main"),
              )
              if launcher is None:
                  raise PipelineError("GUI 模块未安装；请安装项目的 ui 可选依赖")
              try:
                  return launcher(*args, **kwargs)
              except TypeError:
                  # The bundled Qt workbench exposes ``launch(argv=None)``.  Keep the
                  # richer keyword seam for GUI implementations that support it, and
                  # degrade to a normal argv launch for this minimal contract.
                  argv: list[str] = []
                  input_path = kwargs.get("input_path", kwargs.get("input"))
                  if input_path:
                      argv.append(os.fspath(input_path))
                  config_path = kwargs.get("config_path")
                  if config_path:
                      argv.extend(("--config", os.fspath(config_path)))
                  poni = kwargs.get("poni")
                  if poni and isinstance(poni, (str, os.PathLike)):
                      argv.extend(("--poni", os.fspath(poni)))
                  frame = kwargs.get("frame")
                  if frame is not None:
                      argv.extend(("--frame", str(frame)))
                  dataset = kwargs.get("dataset")
                  if dataset:
                      argv.extend(("--dataset", str(dataset)))
                  return launcher(argv or None)
          '''

          new_gui = '''def launch_gui(*args: Any, **kwargs: Any) -> Any:
              """Delegate to one compatible GUI call without masking launcher bugs."""

              launcher = _find_callable(
                  ("butterfly_saxs.gui", "butterfly_saxs.gui.app", "butterfly_saxs.ui"),
                  ("launch", "run", "main"),
              )
              if launcher is None:
                  raise PipelineError("GUI 模块未安装；请安装项目的 ui 可选依赖")

              argv: list[str] = []
              input_path = kwargs.get("input_path", kwargs.get("input"))
              if input_path:
                  argv.append(os.fspath(input_path))
              config_path = kwargs.get("config_path")
              if config_path:
                  argv.extend(("--config", os.fspath(config_path)))
              poni = kwargs.get("poni")
              if poni and isinstance(poni, (str, os.PathLike)):
                  argv.extend(("--poni", os.fspath(poni)))
              frame = kwargs.get("frame")
              if frame is not None:
                  argv.extend(("--frame", str(frame)))
              dataset = kwargs.get("dataset")
              if dataset:
                  argv.extend(("--dataset", str(dataset)))

              try:
                  signature = _inspect.signature(launcher)
              except (TypeError, ValueError):
                  signature = None
              if signature is not None:
                  try:
                      signature.bind(*args, **kwargs)
                  except TypeError:
                      # The bundled workbench exposes ``launch(argv=None)``.
                      # Select that form by binding before execution, so an
                      # internal TypeError is never mistaken for API mismatch.
                      signature.bind(argv or None)
                      return launcher(argv or None)
                  return launcher(*args, **kwargs)

              # Signature-less extension callables retain the legacy fallback.
              try:
                  return launcher(*args, **kwargs)
              except TypeError:
                  return launcher(argv or None)
          '''

          replacements = (
              (old_adapter, new_adapter, "adapter dispatcher"),
              (old_stem, new_stem, "result identity helper"),
              (old_export, new_export, "export docstring"),
              (old_export_stem, new_export_stem, "export stem"),
              (old_gui, new_gui, "GUI dispatcher"),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} block, found {count}")
              text = text.replace(old, new)
          pipeline_path.write_text(text, encoding="utf-8")

          tests_path = Path("tests/test_pipeline_cli.py")
          tests = tests_path.read_text(encoding="utf-8")
          marker = "def test_call_adapter_internal_typeerror_is_not_retried()"
          if marker not in tests:
              tests += '''


def test_call_adapter_internal_typeerror_is_not_retried():
              from butterfly_saxs.pipeline import _call_adapter

              calls = []

              def adapter(image):
                  calls.append(image)
                  raise TypeError("internal adapter failure")

              image = np.ones((4, 4), dtype=float)
              with pytest.raises(TypeError, match="internal adapter failure"):
                  _call_adapter(adapter, image=image)
              assert len(calls) == 1


def test_call_adapter_selects_positional_only_signature():
              from butterfly_saxs.pipeline import _call_adapter

              def adapter(image, /):
                  return image.shape

              image = np.ones((3, 5), dtype=float)
              assert _call_adapter(adapter, image=image) == (3, 5)


def test_launch_gui_internal_typeerror_is_not_retried(monkeypatch):
              from butterfly_saxs import pipeline

              calls = []

              def launcher(*, input_path=None):
                  calls.append(input_path)
                  raise TypeError("internal launcher failure")

              monkeypatch.setattr(pipeline, "_find_callable", lambda *_args: launcher)
              with pytest.raises(TypeError, match="internal launcher failure"):
                  pipeline.launch_gui(input_path="frame.npy")
              assert calls == ["frame.npy"]


def test_export_result_includes_dataset_and_frame_identity(tmp_path):
              from butterfly_saxs.pipeline import PipelineResult, export_result

              def result(frame):
                  return PipelineResult(
                      image=np.ones((3, 3), dtype=float),
                      qmap={},
                      observables={},
                      ridges=[],
                      ellipse_fit={},
                      metadata={
                          "path": "scan.h5",
                          "dataset": "/entry/data",
                          "frame": frame,
                      },
                  )

              first = export_result(result(0), tmp_path)
              second = export_result(result(1), tmp_path)
              first_names = {path.name for path in first}
              second_names = {path.name for path in second}

              assert first_names.isdisjoint(second_names)
              assert all("dataset-entry_data" in name for name in first_names)
              assert all("frame-000000" in name for name in first_names)
              assert all("frame-000001" in name for name in second_names)
          '''
              tests_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/core-hardening.yml").unlink()
          compile(pipeline_path.read_text(encoding="utf-8"), str(pipeline_path), "exec")
          compile(tests_path.read_text(encoding="utf-8"), str(tests_path), "exec")
          PY

      - name: Commit hardened core
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve adapter errors and output identities"
          git push origin "HEAD:${GITHUB_REF_NAME}"
